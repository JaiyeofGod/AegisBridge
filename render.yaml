# Unapplied Render blueprint. Importing it is a deliberate launch step.
# Python is 3.14.8 in .python-version and PYTHON_VERSION. Node is 24.22.0.
# pnpm 10.18.2 comes from the root packageManager field. uv is 0.13.3.
# Header values are literal. Service URLs are copied from Render's own
# RENDER_EXTERNAL_URL, which already includes https://. Do not invent a hostname.

databases:
  - name: aegis-postgres
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: aegisbridge
    user: aegisbridge
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: aegis-broker
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: aegis-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install 'uv==0.13.3' && uv sync --project apps/api --frozen --no-dev
    preDeployCommand: uv run --project apps/api alembic upgrade head
    startCommand: uv run --project apps/api uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "$FORWARDED_ALLOW_IPS"
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: apps/api
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUSTED_HOSTS
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        fromService:
          name: aegis-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: OBJECT_STORAGE_PROVIDER
        value: r2
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: THREAT_INTEL_SYNC_ENABLED
        value: "false"
      - key: WAZUH_ENABLED
        value: "false"

  - type: worker
    name: aegis-worker
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install 'uv==0.13.3' && uv sync --project apps/api --frozen --no-dev
    startCommand: uv run --project apps/api celery -A app.workers.celery_app:celery_app worker --loglevel=info --pool=solo -Q intelligence,integrations
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: apps/api
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          name: aegis-api
          type: web
          envVarKey: SESSION_SECRET
      - key: PUBLIC_API_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUSTED_HOSTS
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        fromService:
          name: aegis-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: OBJECT_STORAGE_PROVIDER
        value: r2
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_BUCKET
        fromService:
          name: aegis-api
          type: web
          envVarKey: S3_BUCKET
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: aegis-api
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: aegis-api
          type: web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: THREAT_INTEL_SYNC_ENABLED
        value: "false"
      - key: WAZUH_ENABLED
        value: "false"

  - type: worker
    name: aegis-beat
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install 'uv==0.13.3' && uv sync --project apps/api --frozen --no-dev
    startCommand: uv run --project apps/api celery -A app.workers.celery_app:celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: apps/api
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aegis-broker
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          name: aegis-api
          type: web
          envVarKey: SESSION_SECRET
      - key: PUBLIC_API_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUSTED_HOSTS
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        fromService:
          name: aegis-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: OBJECT_STORAGE_PROVIDER
        value: r2
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_BUCKET
        fromService:
          name: aegis-api
          type: web
          envVarKey: S3_BUCKET
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: aegis-api
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: aegis-api
          type: web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: THREAT_INTEL_SYNC_ENABLED
        value: "false"
      - key: WAZUH_ENABLED
        value: "false"

  - type: web
    name: aegis-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && AEGIS_REQUIRE_PUBLIC_API=1 pnpm --filter @aegisbridge/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=15552000
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    envVars:
      - key: NODE_VERSION
        value: "24.22.0"
      - key: VITE_API_BASE_URL
        fromService:
          name: aegis-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
